      box.innerHTML = '<p class="tag">03 / 检查理解</p><h2 class="stage-title">“소리 질러”在这里是什么意思？</h2><p class="body-text">结合刚才的词块，选一个解释。</p>';
      choices(['大声喊出来','安静地走开','慢慢睡着'], i => {record('meaning-0107','词义检查',['大声喊出来','安静地走开','慢慢睡着'][i],i===0); state.lesson = i===0 ? 'passed' : 'remedial'; render();});
      explain('系统看的是具体回答。', '答对进入听辨挑战；答错返回相关拆读，不会直接跳过。', '现场可以先选一次 B，观察补学，再回到这题选 A。');
    } else {
      box.innerHTML = '<p class="tag">03 / 已理解这句</p><h2 class="stage-title">答对了：大声喊出来。</h2><div class="feedback good" role="status">词义检查完成。下一步，把学过的文字对应到歌手的声音。</div>';
      actions(button('进入听辨挑战', advance)); explain('理解之后，再练听辨。', '词义已经检查通过，接下来检验能否从原声认出同一句。', '记录保留每次尝试，通关不代表从未出错。');
    }
  }
  if (state.step === 3) {
    box.innerHTML = '<p class="tag">04 / 给原声，选歌词</p><h2 class="stage-title">刚才唱的是哪一句？</h2><p class="body-text">先听，再从同一首歌的歌词中选择。</p>'; player();
    choices(['난 놓치고 싶지 않아','소리 질러','가슴이 뛰는 이 감정을 원했지'], i => {record('listening-0107','给原声选歌词',String.fromCharCode(65+i),i===1,true); state.quizPassed = i===1; state.quizFeedback = i===1 ? '答对了！原声对应 소리 질러。可以继续巩固。' : '这次没有选对。留意“소리”的声音，再听一遍或重新选择。'; render();}, !state.quizHeard || playing || state.quizPassed);
    if (state.quizFeedback) { const f=document.createElement('div'); f.className='feedback'+(state.quizPassed?' good':''); f.setAttribute('role','status'); f.textContent=state.quizFeedback; box.append(f); }
    if(state.quizPassed) actions(button('继续：把歌词串起来',advance));
    explain('先确认听到，再判断会不会。', '音频完整播放后才开放选项。播放失败时保持锁定，并允许重试。', '');
  }
  if (state.step === 4) {
    box.innerHTML = '<p class="tag">05 / 串词巩固</p><h2 class="stage-title">把学过的声音，串回歌词。</h2><p class="body-text">按顺序点选四个字，组成“大声喊出来”。</p><div class="tiles" aria-label="已组成的歌词">'+Array.from({length:4},(_,i)=>'<span class="'+(state.final[i]?'filled':'')+'">'+(state.final[i]||'·')+'</span>').join('')+'</div>';
    const chars=['소','리','질','러']; actions(...['질','러','소','리'].map(char=>button(char,()=>{if(char===chars[state.final.length]){state.final.push(char);if(state.final.length===4){state.finalPassed=true;state.finalFeedback='顺序正确，完成这一轮学习。';record('sequence-0107','串词巩固',chars.join(''),true);}}else{record('sequence-0107','串词巩固',state.final.join('')+char,false);state.final=[];state.finalFeedback='顺序断了，从第一个字 다시开始。'.replace('다시','重新');}render();},'char-button',state.finalPassed)));
    if(state.finalFeedback) {const p=document.createElement('p');p.className='feedback'+(state.finalPassed?' good':'');p.setAttribute('role','status');p.textContent=state.finalFeedback;box.append(p);}
    actions(button('查看这一轮记录',advance,'primary',!state.finalPassed));
    explain('从选择答案，到主动回忆。','把刚才学过的表达重新拼出来，完成对同一句歌词的巩固。','点击顺序：소 → 리 → 질 → 러。随后查看本轮学习记录。');
  }
  if (state.step === 5) {
    const first = new Map(); state.records.forEach(r=>{if(!first.has(r.questionId))first.set(r.questionId,r);}); const good=[...first.values()].filter(r=>r.correct).length;
    box.innerHTML='<p class="tag">06 / 本轮学习记录</p><h2 class="stage-title">通关以后，仍然看得见困难。</h2><div class="record-stats"><div><b>'+state.records.length+'</b><span>作答次数</span></div><div><b>'+good+' / '+first.size+'</b><span>首次作答正确</span></div><div><b>'+state.totalPlayback.success+' / '+state.totalPlayback.failure+'</b><span>原声播放成功 / 失败</span></div></div><div class="table-wrap"><table><thead><tr><th>题目</th><th>作答</th><th>结果</th><th>本次试听 成 / 败</th></tr></thead><tbody id="recordRows"></tbody></table></div>';
    for(const r of state.records){const tr=document.createElement('tr');[r.type,'第 '+r.attempt+' 次',r.correct?'答对':'答错',r.playback?r.playback.success+' / '+r.playback.failure:'—'].forEach((value,i)=>{const td=document.createElement('td');td.textContent=value;if(i===2)td.className=r.correct?'correct':'wrong';tr.append(td);});$('recordRows').append(tr);}
    box.insertAdjacentHTML('beforeend','<p class="small">试听次数按两次提交之间新增的播放计数；顶部为整轮播放总数。记录用于回看。</p>');
    const link=document.createElement('a');link.href='#return';link.textContent='演示完成，返回 PPT';link.onclick=e=>{e.preventDefault();showReturn();};link.className='primary return-cta';actions(link,button('再演示一轮',reset,'secondary'));
    explain('记录过程，才能定位下一次练什么。','首次答错与后续重试分开保留。结合题目类型和播放结果，可以回看是哪一步出现困难。','从目标设定，到学习、练习，再到过程记录，形成一轮可解释的学习流程。');
  }
}
function updatePlan(){const p=state.profile;const focus={listening:['先听辨，再理解','先对照原声和歌词，再检查是否能听出来。'],meaning:['先理解，再回听','先拆解词义与表达作用，再放回歌声里理解。'],reading:['先拆读，再连起来','先认清 소리 / 질러 两个词块，再串起整句。']}[p.goal];const depth={starter:'从词块读音开始，保留基础提示',beginner:'简洁拆读，突出容易混淆的词',comfortable:'精简基础拆读，强调完整表达'}[p.level];$('plan').innerHTML='<b>'+focus[0]+'</b><p>'+focus[1]+'</p><p>'+depth+'。'+({'5':'短课：建议 2 个普通关','10':'标准课：建议 3 个普通关','15':'扩展课：建议 4–5 个普通关'}[p.minutes])+'，另加终关。</p>';explain('先知道你想怎么学。','基础影响解释深度，目标影响教学重点，时间影响课程长度。切换选项，可以立即对照计划摘要。','本轮学习：소리 질러。先拆读，再听原唱的实际表达。');}
function reset(){stopAudio();state=fresh();render();}
$('restart').onclick=reset;
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('fullscreen').textContent='请使用浏览器全屏';}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAudio();render();}});
window.addEventListener('pagehide',stopAudio);
render();

function showReturn(){let d=document.getElementById('returnHelp');if(!d){d=document.createElement('dialog');d.id='returnHelp';d.innerHTML='<h2>回到 PPT，继续讲解</h2><p>按 ⌘Tab 返回 PowerPoint，再按 → 继续。Windows 使用 Alt+Tab。</p><p class="small">PPT 会保留原来的放映位置。</p><button class="primary" id="closeReturn">继续留在网页</button>';document.body.append(d);document.getElementById('closeReturn').onclick=()=>d.close();}d.showModal();}
document.getElementById('returnLink').href='#return';document.getElementById('returnLink').textContent='返回 PPT';document.getElementById('returnLink').onclick=e=>{e.preventDefault();stopAudio();showReturn();};document.querySelector('.brand').href='#';document.querySelector('.brand').onclick=e=>{e.preventDefault();showReturn();};
</script>
</body></html>
